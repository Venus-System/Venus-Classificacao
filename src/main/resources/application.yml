server:
  port: ${SERVER_PORT}

spring:
  application:
    name: venus-classificacao

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=venus&sslmode=require&stringtype=unspecified
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: venus
    show-sql: false
    open-in-view: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

venus:
  security:
    firebase:
      project-id: ${FIREBASE_PROJECT_ID}
  scoring:
    base-model-id: ${SCORING_BASE_MODEL_ID}
