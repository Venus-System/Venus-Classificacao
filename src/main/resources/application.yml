server:
  port: ${SERVER_PORT}

spring:
  application:
    name: venus-classificacao

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=venus&sslmode=require&stringtype=unspecified
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: venus
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      timeout: 1s
      connect-timeout: 1s

  cache:
    type: redis
    redis:
      time-to-live: 6h

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

venus:
  security:
    admin-token:
      secret: ${ADMIN_JWT_SECRET}
    firebase:
      project-id: ${FIREBASE_PROJECT_ID}
  scoring:
    base-model-id: ${SCORING_BASE_MODEL_ID}
